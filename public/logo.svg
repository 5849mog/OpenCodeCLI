<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Open Code Web 品牌标识（双色 N 折纸）：
       深近黑圆角方块底座 + N 折纸 monogram——左侧与斜切面橙色、右侧灰白，
       保留折纸构型的「呼吸」。由此 SVG 派生 favicon/apple-touch/PWA 全套。 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141414"/>
      <stop offset="1" stop-color="#0A0A0A"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="398" height="398" rx="88" fill="url(#bg)" stroke="#2A2A2A" stroke-width="2"/>
  <g transform="translate(64 64) scale(9.0667)">
    <g fill="#E58F67">
      <polygon points="24.3,7.1 13.14,22.91 5.7,22.91 16.86,7.1"/>
      <path d="M15.47,7.1 l-1.3,1.85 c-0.2,0.29-0.54,0.47-0.9,0.47 h-7.1 V7.09 Z"/>
    </g>
    <g fill="#E7E5E4">
      <path d="M14.53,22.91 l1.31-1.86 c0.2,-0.29 0.54,-0.47 0.9,-0.47 h7.09 v2.33 Z"/>
    </g>
    <animate attributeName="opacity" values="1;0.92;1" dur="2.5s" repeatCount="indefinite"/>
  </g>
</svg>
