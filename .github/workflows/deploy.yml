name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- bc WebAssembly compilation ---
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v13
        with:
          version: 3.1.55

      - name: Build bc.wasm
        run: bash tools/bc-wasm/build.sh

      - name: Build awk.wasm
        run: bash tools/awk-wasm/build.sh

      # --- Node/Bun setup ---
      - uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            bun install && break
            echo "bun install failed (attempt $i), retrying in 5s..."
            sleep 5
          done

      - name: Set repo name
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          echo "REPO_NAME=$REPO_NAME" >> $GITHUB_ENV
          if [[ "${{ github.repository }}" == *.github.io ]]; then
            echo "REPO_NAME=" >> $GITHUB_ENV
          fi

      - name: Build
        run: bun run build
        env:
          REPO_NAME: ${{ env.REPO_NAME }}

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
