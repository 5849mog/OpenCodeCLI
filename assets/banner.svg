    <path d="M0 80H1280 M0 160H1280 M0 240H1280 M0 320H1280"/>
    <path d="M80 0V400 M160 0V400 M240 0V400 M320 0V400 M400 0V400 M480 0V400 M560 0V400 M640 0V400 M720 0V400 M800 0V400 M880 0V400 M960 0V400 M1040 0V400 M1120 0V400 M1200 0V400"/>
  </g>
