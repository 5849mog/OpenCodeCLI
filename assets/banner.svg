<svg width="1600" height="520" viewBox="0 0 1600 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景：产品同款深色中性黑 + 细网格 -->
  <rect width="1600" height="520" fill="#0A0A0A"/>
  <g stroke="#141414" stroke-width="1">
    <path d="M0 40H1600 M0 80H1600 M0 120H1600 M0 160H1600 M0 200H1600 M0 240H1600 M0 280H1600 M0 320H1600 M0 360H1600 M0 400H1600 M0 440H1600 M0 480H1600"/>
    <path d="M40 0V520 M80 0V520 M120 0V520 M160 0V520 M200 0V520 M240 0V520 M280 0V520 M320 0V520 M360 0V520 M400 0V520 M440 0V520 M480 0V520 M520 0V520 M560 0V520 M600 0V520 M640 0V520 M680 0V520 M720 0V520 M760 0V520 M800 0V520 M840 0V520 M880 0V520 M920 0V520 M960 0V520 M1000 0V520 M1040 0V520 M1080 0V520 M1120 0V520 M1160 0V520 M1200 0V520 M1240 0V520 M1280 0V520 M1320 0V520 M1360 0V520 M1400 0V520 M1440 0V520 M1480 0V520 M1520 0V520 M1560 0V520"/>
  </g>
  <!-- 橙色强调竖线 -->
  <rect x="0" y="0" width="6" height="520" fill="#E58F67"/>

  <!-- ================= 左列：标题 / 副标题 / 特性胶囊 / 数据块 ================= -->
  <g font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="88" y="140" font-size="56" font-weight="700" fill="#F0F0F0">Open Code Web</text>
    <text x="92" y="188" font-size="21" fill="#8A8A8A">浏览器里的 AI 编程副驾 · 无需服务器 · 没有账号</text>
    <text x="92" y="220" font-size="21" fill="#8A8A8A">iPad 打开即用 · 数据只属于你的浏览器</text>

    <!-- 特性胶囊 -->
    <g font-size="15" fill="#A6A6A6">
      <rect x="88" y="264" width="153" height="40" rx="20" stroke="#2A2A2A" fill="#111111"/>
      <text x="116" y="289">纯前端静态部署</text>
      <rect x="253" y="264" width="219" height="40" rx="20" stroke="#2A2A2A" fill="#111111"/>
      <text x="282" y="289">DeepSeek 真分词器</text>
      <rect x="484" y="264" width="183" height="40" rx="20" stroke="#2A2A2A" fill="#111111"/>
      <text x="513" y="289">ZCode 式界面</text>
    </g>

    <!-- 数据块 -->
    <g>
      <rect x="88" y="348" width="118" height="86" rx="12" stroke="#262626" fill="#101010"/>
      <text x="108" y="402" font-size="34" font-weight="700" fill="#E58F67">44</text>
      <text x="108" y="424" font-size="12" fill="#6B6B6B">原生工具</text>

      <rect x="214" y="348" width="118" height="86" rx="12" stroke="#262626" fill="#101010"/>
      <text x="234" y="402" font-size="34" font-weight="700" fill="#E58F67">128k</text>
      <text x="234" y="424" font-size="12" fill="#6B6B6B">BPE 词表</text>

      <rect x="340" y="348" width="118" height="86" rx="12" stroke="#262626" fill="#101010"/>
      <text x="360" y="402" font-size="34" font-weight="700" fill="#E58F67">0</text>
      <text x="360" y="424" font-size="12" fill="#6B6B6B">服务器</text>

      <rect x="466" y="348" width="118" height="86" rx="12" stroke="#262626" fill="#101010"/>
      <text x="486" y="402" font-size="34" font-weight="700" fill="#E58F67">100%</text>
      <text x="486" y="424" font-size="12" fill="#6B6B6B">浏览器内</text>
    </g>
  </g>

  <!-- ================= 右列：产品拼贴 ================= -->
  <!-- 迷你侧栏 -->
  <g font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="720" y="70" width="230" height="318" rx="14" stroke="#262626" fill="#121212"/>
    <circle cx="748" cy="104" r="16" fill="#E58F67"/>
    <text x="738" y="109" font-size="12" font-weight="700" fill="#0A0A0A">OC</text>
    <text x="772" y="108" font-size="16" fill="#E8E8E8">Open Code</text>
    <g font-size="14" fill="#A6A6A6">
      <circle cx="746" cy="156" r="6" fill="#2A2A2A"/>
      <text x="762" y="161">新建任务</text>
      <text x="820" y="161" font-size="11" fill="#555555">⌘N</text>
      <circle cx="746" cy="196" r="6" fill="#2A2A2A"/>
      <text x="762" y="201">搜索会话</text>
      <text x="820" y="201" font-size="11" fill="#555555">⌘K</text>
      <circle cx="746" cy="236" r="6" fill="#2A2A2A"/>
      <text x="762" y="241">Skill</text>
      <circle cx="746" cy="276" r="6" fill="#E58F67"/>
      <text x="762" y="281" fill="#E8E8E8">文件袋</text>
    </g>
    <rect x="736" y="314" width="198" height="52" rx="10" fill="#1A1A1A"/>
    <text x="752" y="338" font-size="12" fill="#A6A6A6">会话 · 随意创建一个文件</text>
    <text x="752" y="355" font-size="10" fill="#555555">刚刚 · 4 个会话</text>
  </g>

  <!-- 终端卡片（对话模拟 + token 徽标） -->
  <g font-family="Consolas,'SF Mono',Menlo,monospace">
    <rect x="970" y="70" width="560" height="230" rx="14" fill="#161616" stroke="#2A2A2A"/>
    <circle cx="998" cy="98" r="6" fill="#E58F67"/>
    <circle cx="1018" cy="98" r="6" fill="#333333"/>
    <circle cx="1038" cy="98" r="6" fill="#333333"/>
    <text x="998" y="142" font-size="15" fill="#8A8A8A">$ open-code ask “写一个 love.txt”</text>
    <text x="998" y="172" font-size="15" fill="#A6A6A6">▸ 思考中 · 实时分词 ≈1,284 tokens</text>
    <rect x="1290" y="158" width="120" height="26" rx="13" stroke="#E58F67" stroke-opacity="0.5" fill="#1A1A1A"/>
    <text x="1310" y="176" font-size="12" fill="#E58F67">≈1.3k tokens</text>
    <text x="998" y="202" font-size="15" fill="#A6A6A6">▸ 已编辑 love.txt +7 -0 · diff 预览</text>
    <text x="998" y="232" font-size="15" fill="#A6A6A6">▸ 探索 2 文件 · zip 上传自动解压</text>
    <text x="998" y="262" font-size="15" fill="#E58F67">✓ 任务结束 · 2 个文件已更改 +58 -116</text>
  </g>

  <!-- 工具徽标条（WASM 原生引擎） -->
  <g font-family="ui-monospace,Consolas,Menlo,monospace" font-size="15" fill="#A6A6A6">
    <rect x="970" y="316" width="86" height="44" rx="10" stroke="#2A2A2A" fill="#111111"/>
    <text x="997" y="343">bash</text>
    <rect x="1066" y="316" width="86" height="44" rx="10" stroke="#2A2A2A" fill="#111111"/>
    <text x="1096" y="343">lua</text>
    <rect x="1162" y="316" width="86" height="44" rx="10" stroke="#2A2A2A" fill="#111111"/>
    <text x="1195" y="343">js</text>
    <rect x="1258" y="316" width="86" height="44" rx="10" stroke="#2A2A2A" fill="#111111"/>
    <text x="1282" y="343">awk</text>
    <rect x="1354" y="316" width="86" height="44" rx="10" stroke="#2A2A2A" fill="#111111"/>
    <text x="1378" y="343">sed</text>
    <rect x="1450" y="316" width="80" height="44" rx="10" stroke="#E58F67" stroke-opacity="0.4" fill="#1A1A1A"/>
    <text x="1477" y="343" fill="#E58F67">git</text>
  </g>

  <!-- 底部数据流条：真分词器链路 -->
  <g font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="720" y="386" width="810" height="56" rx="12" stroke="#242424" fill="#111111"/>
    <circle cx="756" cy="414" r="5" fill="#E58F67"/>
    <text x="776" y="419" font-size="15" fill="#C9C9C9">输入 + 附件 → 真分词器（128k BPE · WASM）→ ≈N 实时计数 · /tokens 精确占用 · 预算截断</text>
  </g>

  <!-- 底部快捷键条 -->
  <g font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#8A8A8A">
    <rect x="88" y="460" width="150" height="34" rx="17" stroke="#262626" fill="#101010"/>
    <text x="110" y="482">Shift+Tab</text>
    <text x="188" y="482" fill="#6B6B6B">Plan / Bypass</text>
    <rect x="330" y="460" width="66" height="34" rx="17" stroke="#262626" fill="#101010"/>
    <text x="344" y="482">⌘N</text>
    <text x="404" y="482" fill="#6B6B6B">新建任务</text>
    <rect x="506" y="460" width="66" height="34" rx="17" stroke="#262626" fill="#101010"/>
    <text x="520" y="482">⌘K</text>
    <text x="580" y="482" fill="#6B6B6B">搜索会话</text>
    <rect x="682" y="460" width="96" height="34" rx="17" stroke="#262626" fill="#101010"/>
    <text x="698" y="482">Enter</text>
    <text x="786" y="482" fill="#6B6B6B">发送 · Shift+Enter 换行</text>
  </g>
</svg>
