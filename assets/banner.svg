  <!-- 终端卡片（右侧） -->
  <rect x="780" y="86" width="404" height="228" rx="14" fill="#161616" stroke="#2A2A2A"/>
  <circle cx="808" cy="114" r="6" fill="#E58F67"/>
  <circle cx="828" cy="114" r="6" fill="#333333"/>
  <circle cx="848" cy="114" r="6" fill="#333333"/>
  <g font-family="Consolas,'SF Mono',Menlo,monospace" font-size="17">
    <text x="808" y="162" fill="#8A8A8A">$ open-code ask “写一个 love.txt”</text>
