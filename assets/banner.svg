  <rect x="0" y="0" width="6" height="400" fill="#E58F67"/>
  <!-- 标题 -->
  <text x="96" y="168" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="64" font-weight="700" fill="#F0F0F0">Open Code Web</text>
  <text x="100" y="224" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="26" fill="#8A8A8A">浏览器里的 AI 编程副驾 · 无需服务器 · iPad 即可写代码</text>
