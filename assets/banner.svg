    <rect x="96" y="268" width="168" height="42" rx="21" stroke="#2A2A2A" fill="#111111"/>
    <text x="128" y="294">纯前端静态部署</text>
    <rect x="280" y="268" width="216" height="42" rx="21" stroke="#2A2A2A" fill="#111111"/>
    <text x="316" y="294">DeepSeek 真分词器</text>
    <rect x="512" y="268" width="172" height="42" rx="21" stroke="#2A2A2A" fill="#111111"/>
    <text x="542" y="294">ZCode 式界面</text>
    <rect x="700" y="268" width="196" height="42" rx="21" stroke="#2A2A2A" fill="#111111"/>
    <text x="734" y="294">WASM 原生工具链</text>
